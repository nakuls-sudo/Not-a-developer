<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Smart Ingredient Hub</title>
    <style>
        :root { --bg: #0f172a; --panel: #1e293b; --accent: #38bdf8; --text: #f1f5f9; --chip: #334155; --chip-sel: #0ea5e9; --danger: #f43f5e; --success: #22c55e; --warning: #fbbf24; }
        body, html { height: 100%; margin: 0; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); overflow-x: hidden; }

        /* WELCOME PAGE */
        #welcome-page {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 100; transition: transform 1.2s cubic-bezier(0.7, 0, 0.3, 1);
            padding: 40px; box-sizing: border-box; text-align: center;
        }
        #welcome-page.hidden { transform: translateY(-100%); }
        .welcome-content h1 { font-size: 4rem; margin: 0; color: var(--accent); letter-spacing: -2px; }
        .welcome-content p { font-size: 1.2rem; color: #94a3b8; margin: 10px 0 40px; }

        /* EXERCISE PAGE */
        #teaser-page {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #020617;
            display: none;
            flex-direction: column; justify-content: center; align-items: center;
            z-index: 200; text-align: center; padding: 40px;
        }
        #teaser-page.visible { display: flex; animation: fadeIn 0.8s ease-out; }
        .yoga-card { background: var(--panel); padding: 30px; border-radius: 20px; border: 1px solid var(--accent); max-width: 400px; margin-top: 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        .yoga-img { width: 100%; height: 250px; border-radius: 12px; background-size: cover; background-position: center; margin-bottom: 20px; border: 1px solid #334155; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* NOTIFICATIONS */
        .notification-container { display: flex; flex-direction: column; gap: 15px; position: absolute; top: 40px; right: 40px; width: 320px; text-align: left; }
        .notif-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); padding: 20px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 10px 30px rgba(0,0,0,0.4); animation: slideIn 0.5s ease-out; }
        .notif-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; font-weight: 800; }
        .notif-med { color: var(--warning); }
        .notif-mind { color: var(--accent); }
        .notif-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 3px; display: block; }

        @keyframes slideIn { from { opacity: 0; transform: translateX(50px); } to { opacity: 1; transform: translateX(0); } }

        .btn-start { background: var(--accent); color: var(--bg); border: none; padding: 18px 50px; border-radius: 40px; font-size: 1.2rem; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-start:hover { transform: translateY(-3px); box-shadow: 0 15px 35px rgba(56, 189, 248, 0.5); }

        /* APP CONTENT */
        .app-container { padding: 20px; opacity: 0; transition: opacity 1s ease-in; display: none; }
        .app-container.visible { opacity: 1; display: block; }
        .grid { display: grid; grid-template-columns: 400px 1fr; gap: 20px; height: calc(100vh - 40px); }
        .panel { background: var(--panel); padding: 25px; border-radius: 20px; border: 1px solid #334155; overflow-y: auto; }
        
        .chip-container { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 15px; }
        .chip { padding: 8px 14px; background: var(--chip); border-radius: 25px; cursor: pointer; font-size: 0.85rem; transition: 0.2s; border: 1px solid transparent; }
        .chip.selected { background: var(--chip-sel); border-color: white; }

        .meal-card { background: rgba(255,255,255,0.03); padding: 18px; border-radius: 15px; margin-bottom: 12px; border-left: 5px solid #475569; cursor: pointer; transition: 0.2s; }
        .ready { border-left-color: var(--success) !important; }
        .cuisine-sub { color: #94a3b8; font-style: italic; margin-left: 15px; font-size: 0.8rem; float: right; }

        .img-preview { width: 100%; height: 300px; background-size: cover; background-position: center; border-radius: 15px; margin-bottom: 20px; }
        .recipe-section { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .instruction-step { background: rgba(0,0,0,0.15); padding: 12px; border-radius: 10px; margin-bottom: 8px; font-size: 0.95rem; line-height: 1.5; border-left: 3px solid var(--accent); }

        #thanksBtn {
            display: none; width: 100%; margin-top: 25px; padding: 15px;
            background: var(--success); color: white; border: none; border-radius: 12px;
            font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: 0.3s;
            box-shadow: 0 5px 15px rgba(34, 197, 94, 0.3);
        }
    </style>
</head>
<body>

<div id="welcome-page">
    <div class="notification-container" id="notif-area"></div>
    <div class="welcome-content">
        <h1>Chef's Portal</h1>
        <p>A touch of magic for your daily pantry.</p>
        <button class="btn-start" onclick="enterApp()">Get Started</button>
    </div>
</div>

<div id="teaser-page">
    <h1 style="font-size: 3rem; color: var(--danger); margin: 0;">You think you were done???</h1>
    <p style="color: #94a3b8; font-size: 1.5rem; margin-top: 10px;">Now do this Exercise:</p>
    
    <div class="yoga-card">
        <div id="yogaImage" class="yoga-img"></div>
        <h2 id="yogaName" style="color: var(--accent); margin-bottom: 10px;"></h2>
        <p id="yogaDesc" style="font-size: 0.9rem; color: #94a3b8;"></p>
    </div>

    <button class="btn-start" style="margin-top: 30px; background: transparent; border: 2px solid var(--accent); color: var(--accent);" onclick="location.reload()">Back to Pantry</button>
</div>

<div id="app-content" class="app-container">
    <div class="grid">
        <div class="panel">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h2 style="margin:0">Your Pantry</h2>
                <button onclick="clearAll()" style="background:none; border:1px solid var(--danger); color:var(--danger); cursor:pointer; padding:6px 12px; border-radius:8px;">Clear All</button>
            </div>
            <div id="pantryChips" class="chip-container"></div>
            <hr style="border: 0.5px solid #334155; margin: 30px 0;">
            <h3>Top Suggestions</h3>
            <div id="suggestionResults"></div>
        </div>

        <div class="panel">
            <h2 id="viewTitle" style="margin-top:0">Chef's View</h2>
            <div id="mealImage" class="img-preview" style="background-image: url('https://images.unsplash.com/photo-1495195129352-aec3297755a3?w=800');"></div>
            
            <div class="recipe-section" id="recipeDisplay">
                <div id="ingredientsList">
                    <p style="color: #94a3b8;">Select a meal to see your checklist and steps.</p>
                </div>
                <div id="howToCook"></div>
            </div>
            <button id="thanksBtn" onclick="finishMeal()">Thanks, I'm Full! 😋</button>
        </div>
    </div>
</div>

<script>
    /* AUDIO SYNTHESIZER FOR "STOMACH FULL" SIGH */
    function playFullSound() {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioContext();
        
        // Main low frequency breath
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        
        osc.type = 'sawtooth'; // Rougher texture
        osc.frequency.setValueAtTime(110, ctx.currentTime); // Deep male tone
        osc.frequency.exponentialRampToValueAtTime(70, ctx.currentTime + 1.5); // Dropping pitch
        
        gain.gain.setValueAtTime(0, ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.2, ctx.currentTime + 0.2);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 1.8);
        
        // Lowpass filter to make it sound muffled/from a chest
        const filter = ctx.createBiquadFilter();
        filter.type = "lowpass";
        filter.frequency.value = 400;

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);
        
        osc.start();
        osc.stop(ctx.currentTime + 1.8);
    }

    const MEDS = [
        { name: "Pregniba TT2", times: ["08:00", "16:00", "00:00"] },
        { name: "Calcium Supplement", times: ["12:00"] },
        { name: "Zinc Supplement", times: ["18:30"] }
    ];

    const RANDOM_TASKS = ["Check your weight", "Check sugar glucose", "Remember to smile! 😊", "Stop staring at the mobile"];

    const MY_MEALS = [
        { name: "Chicken Curry with Rice", type: "Indian", ingredients: ["Chicken", "Rice", "Tomatoes", "Onions", "Garlic", "Ginger", "Spices"], steps: ["Sauté onions, ginger, and garlic.", "Add spices and tomatoes.", "Add chicken and simmer.", "Serve with rice."], img: "https://images.unsplash.com/photo-1604908176997-431b03b0f98b?w=600" },
        { name: "Aloo Paratha", type: "Indian", ingredients: ["Wheat Flour", "Potatoes", "Spices"], steps: ["Boil and mash potatoes.", "Stuff into wheat dough.", "Cook on tawa with butter."], img: "https://images.unsplash.com/photo-1612929633738-8fe44f7ec841?w=600" },
        { name: "Egg Bhurji", type: "Indian", ingredients: ["Eggs", "Onions", "Tomatoes", "Green Chilies", "Spices"], steps: ["Sauté aromatics.", "Scramble eggs in the pan.", "Season and serve."], img: "https://images.unsplash.com/photo-1604908554027-df7b8a8f5c1d?w=600" },
        { name: "Nasi Goreng", type: "Indonesian", ingredients: ["Rice", "Eggs", "Chicken", "Garlic", "Onions", "Green Chilies"], steps: ["Stir-fry aromatics and chicken.", "Add rice and sauces.", "Top with fried egg."], img: "https://images.unsplash.com/photo-1604908177522-040c7b7b6f83?w=600" },
        { name: "Mie Goreng", type: "Indonesian", ingredients: ["Wheat Flour", "Eggs", "Chicken", "Cabbage"], steps: ["Boil noodles.", "Stir-fry chicken and veg.", "Toss together."], img: "https://images.unsplash.com/photo-1617093727343-374698b1b08d?w=600" },
        { name: "Chicken Tacos", type: "Mexican", ingredients: ["Wheat Flour", "Chicken", "Onions", "Bell Peppers"], steps: ["Sear chicken and peppers.", "Warm tortillas.", "Assemble."], img: "https://images.unsplash.com/photo-1601924582975-7e2e65d5b6e4?w=600" },
        { name: "Mashed Potatoes", type: "American", ingredients: ["Potatoes", "Butter", "Milk"], steps: ["Boil potatoes.", "Mash with butter/milk."], img: "https://images.unsplash.com/photo-1514433350160-2da8f33d0ad9?w=600" },
        { name: "Omelette", type: "American", ingredients: ["Eggs", "Cheese", "Bell Peppers", "Onions"], steps: ["Whisk eggs.", "Sauté fillings.", "Fold together."], img: "https://images.unsplash.com/photo-1587735243615-c03f25aaff15?w=600" }
    ];

    const YOGA_POSES = [
        { name: "Tree Pose", desc: "Focus on a single point to improve balance and hip strength.", img: "https://images.unsplash.com/photo-1544367567-0f2fcb009e0b?w=500" },
        { name: "Warrior II", desc: "A powerful pose that strengthens legs and improves stamina.", img: "https://images.unsplash.com/photo-1506126613408-eca07ce68773?w=500" },
        { name: "Cobra Pose", desc: "Perfect for stretching the chest and improving back flexibility.", img: "https://images.unsplash.com/photo-1599447421416-3414500d18a5?w=500" },
        { name: "Child's Pose", desc: "A calming stretch for the back, hips, and shoulders.", img: "https://images.unsplash.com/photo-1510894347713-fc3ad6cb0d4d?w=500" },
        { name: "Triangle Pose", desc: "Increases flexibility in the spine and legs.", img: "https://images.unsplash.com/photo-1575052814086-f385e2e2ad1b?w=500" }
    ];

    let selectedPantry = new Set();

    function playMagicSound() {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.frequency.setValueAtTime(200, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1200, ctx.currentTime + 1.2);
        gain.gain.setValueAtTime(0, ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.15, ctx.currentTime + 0.1);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 1.2);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(); osc.stop(ctx.currentTime + 1.2);
    }

    function initNotifications() {
        const area = document.getElementById('notif-area');
        area.innerHTML = "";
        const now = new Date();
        const curMins = now.getHours() * 60 + now.getMinutes();
        MEDS.forEach(med => {
            med.times.forEach(t => {
                const [h, m] = t.split(':').map(Number);
                if (Math.abs(curMins - (h * 60 + m)) <= 60) {
                    const card = document.createElement('div'); card.className = 'notif-card';
                    card.innerHTML = `<div class="notif-label notif-med">Due Now</div><span class="notif-title">${med.name}</span><span style="font-size:0.8rem; color:#94a3b8;">Time: ${t}</span>`;
                    area.appendChild(card);
                }
            });
        });
        const task = RANDOM_TASKS[Math.floor(Math.random() * RANDOM_TASKS.length)];
        const tCard = document.createElement('div'); tCard.className = 'notif-card';
        tCard.innerHTML = `<div class="notif-label notif-mind">Mindful Check</div><span class="notif-title">${task}</span>`;
        area.appendChild(tCard);
    }

    function initChips() {
        const container = document.getElementById('pantryChips');
        const ALL = ["Rice", "Wheat Flour", "Eggs", "Chicken", "Potatoes", "Tomatoes", "Onions", "Garlic", "Ginger", "Green Chilies", "Bell Peppers", "Cabbage", "Milk", "Butter", "Cheese", "Cooking Oil", "Spices"];
        ALL.sort().forEach(ing => {
            const span = document.createElement('span'); span.className = 'chip'; span.innerText = ing;
            span.onclick = () => {
                selectedPantry.has(ing) ? selectedPantry.delete(ing) : selectedPantry.add(ing);
                span.classList.toggle('selected');
                calculateSuggestions();
            };
            container.appendChild(span);
        });
    }

    function calculateSuggestions() {
        const container = document.getElementById('suggestionResults');
        if (selectedPantry.size === 0) { container.innerHTML = '<p style="text-align:center; color:#64748b;">Select ingredients above.</p>'; return; }
        const results = MY_MEALS.map(meal => ({ ...meal, missing: meal.ingredients.filter(i => !selectedPantry.has(i)) })).sort((a, b) => a.missing.length - b.missing.length);
        container.innerHTML = "";
        results.slice(0, 7).forEach(meal => {
            const div = document.createElement('div'); div.className = `meal-card ${meal.missing.length === 0 ? 'ready' : ''}`;
            div.innerHTML = `<span class="cuisine-sub">${meal.type}</span><strong>${meal.name}</strong><br>` + (meal.missing.length === 0 ? '<span style="color:var(--success)">● Ready</span>' : `<span style="color:var(--warning); font-size:0.8rem">Need: ${meal.missing.join(', ')}</span>`);
            div.onclick = () => showMeal(meal);
            container.appendChild(div);
        });
    }

    function showMeal(meal) {
        document.getElementById('viewTitle').innerText = `${meal.name} (${meal.type})`;
        document.getElementById('mealImage').style.backgroundImage = `url('${meal.img}')`;
        document.getElementById('ingredientsList').innerHTML = `<h4 style="margin-top:0; color:var(--accent)">Checklist</h4>` + meal.ingredients.map(i => selectedPantry.has(i) ? `<div style="color:var(--success)">✔ ${i}</div>` : `<div style="color:var(--danger)">✖ ${i}</div>`).join('');
        document.getElementById('howToCook').innerHTML = `<h4 style="margin-top:0; color:var(--accent)">How to Cook</h4>` + meal.steps.map((step, idx) => `<div class="instruction-step"><strong>Step ${idx+1}:</strong> ${step}</div>`).join('');
        document.getElementById('thanksBtn').style.display = "block";
    }

    function enterApp() { playMagicSound(); document.getElementById('welcome-page').classList.add('hidden'); document.getElementById('app-content').classList.add('visible'); }
    
    function finishMeal() {
        // Trigger the sound
        playFullSound();

        // Populate Yoga Teaser
        const pose = YOGA_POSES[Math.floor(Math.random() * YOGA_POSES.length)];
        document.getElementById('yogaName').innerText = pose.name;
        document.getElementById('yogaDesc').innerText = pose.desc;
        document.getElementById('yogaImage').style.backgroundImage = `url('${pose.img}')`;
        
        // Visual Switch
        document.getElementById('app-content').style.display = 'none';
        document.getElementById('teaser-page').classList.add('visible');
    }

    function clearAll() { selectedPantry.clear(); document.querySelectorAll('.chip').forEach(c => c.classList.remove('selected')); calculateSuggestions(); document.getElementById('thanksBtn').style.display = "none"; }
    
    window.onload = () => { initNotifications(); initChips(); };
</script>
</body>
</html>
